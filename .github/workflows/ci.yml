name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar nombres de archivo PSR-4
        run: composer dump-autoload --optimize --strict-psr

      - name: Formato de código (pint)
        run: vendor/bin/pint --test

      - name: Rutas explícitas (sin Route::resource / apiResource)
        run: |
          if grep -rnE "(Route::|->)(apiResources?|resources?)\(" routes; then
            echo "::error::Declarar las rutas una por una; Route::resource y apiResource no están permitidos."
            exit 1
          fi

      - name: AJAX solo a través de ApiClient
        # TODO: quitar la excepción del dashboard cuando el Equipo G mueva su JS a ApiClient
        run: |
          if grep -rnE "\bfetch\(|\baxios\b|\$\.ajax|XMLHttpRequest" resources/js resources/views \
            | grep -v "^resources/js/commons/api-client.js:" \
            | grep -v "^resources/views/dashboard/index.blade.php:"; then
            echo "::error::Usar ApiClient (resources/js/commons/api-client.js) en lugar de fetch, axios o \$.ajax directos."
            exit 1
          fi

      - name: Instalar dependencias JS
        run: npm ci

      - name: Compilar assets (detecta entradas faltantes en vite.config.js)
        run: npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migraciones y seeders desde cero
        run: php artisan migrate:fresh --seed --force

      - name: Tests
        run: php artisan test
